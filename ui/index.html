<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Singleton — register of liens</title>
<meta name="description" content="A neutral first to file register of on-chain collateral, on Creditcoin. Check whether an asset already carries a lien before lending against it." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235f49ab'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3C/svg%3E" />
<style>
  :root {
    /* one restrained accent, verified against white at 6.9:1 */
    --bg: oklch(1 0 0);
    --panel: oklch(0.985 0.004 290);
    --panel-2: oklch(0.968 0.006 290);
    --line: oklch(0.905 0.008 290);
    --line-strong: oklch(0.86 0.01 290);
    --ink: oklch(0.245 0.015 290);
    --ink-2: oklch(0.47 0.018 290);
    --accent: oklch(0.48 0.15 290);
    --accent-hover: oklch(0.42 0.15 290);
    --accent-wash: oklch(0.955 0.03 290);
    --danger: oklch(0.52 0.18 27);
    --danger-wash: oklch(0.96 0.035 27);
    --good: oklch(0.5 0.09 168);
    --neutral: oklch(0.56 0.03 290);

    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

    --r: 6px;
    --shadow: 0 1px 2px oklch(0.245 0.015 290 / 0.06), 0 4px 12px oklch(0.245 0.015 290 / 0.04);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);

    --z-sticky: 10;
    --z-toast: 40;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button, input, select { font: inherit; color: inherit; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .mono { font-family: var(--mono); font-size: 0.92em; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------- shell */

  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 340px 1fr;
    grid-template-areas: "bar bar" "rail main";
  }

  /* ----------------------------------------------------------- top bar */

  .bar {
    grid-area: bar;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 16px 0 18px;
    height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .mark { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -0.01em; }
  .mark svg { display: block; }
  .mark span { color: var(--ink-2); font-weight: 400; }

  .status { display: flex; gap: 18px; margin-left: auto; font-size: 12.5px; color: var(--ink-2); }
  .status b { color: var(--ink); font-weight: 500; }
  .status div { display: flex; align-items: center; gap: 7px; }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
  .dot.idle { background: var(--line-strong); }

  .bar .reg { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }

  /* -------------------------------------------------------------- rail */

  .rail {
    grid-area: rail;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: grid;
    grid-template-rows: auto auto 1fr;
    min-height: 0;
  }

  .lookup { padding: 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .lookup .row { display: grid; grid-template-columns: 1fr 84px; gap: 8px; }

  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }

  input, select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    padding: 7px 9px;
    font-size: 13px;
    transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }

  input.mono { font-size: 12.5px; }
  input::placeholder { color: var(--ink-2); opacity: 1; }
  input:hover, select:hover { border-color: var(--neutral); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }

  .btn {
    background: var(--accent);
    color: var(--bg);
    border: 1px solid var(--accent);
    border-radius: var(--r);
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 150ms var(--ease), border-color 150ms var(--ease);
  }

  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:active { transform: translateY(0.5px); }
  .btn[disabled] { background: var(--panel-2); border-color: var(--line-strong); color: var(--ink-2); cursor: not-allowed; }

  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { background: var(--panel-2); border-color: var(--neutral); }

  .rail-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 12px 14px 8px;
    font-size: 12.5px;
    color: var(--ink-2);
  }

  .list { overflow: auto; padding: 0 8px 12px; min-height: 0; }

  .item {
    width: 100%;
    display: grid;
    grid-template-columns: 8px 1fr auto;
    align-items: center;
    gap: 10px;
    text-align: left;
    background: none;
    border: 0;
    border-radius: var(--r);
    padding: 9px 10px;
    cursor: pointer;
    transition: background 140ms var(--ease);
  }

  .item:hover { background: var(--panel-2); }
  .item[aria-current="true"] { background: var(--accent-wash); }
  .item[aria-current="true"] .item-name { color: var(--accent); font-weight: 500; }

  .pip { width: 8px; height: 8px; border-radius: 2px; background: var(--neutral); }
  .pip.pledged { background: var(--accent); }
  .pip.settled { background: var(--good); }
  .pip.free { background: var(--line-strong); }

  .item-name { font-size: 13px; }
  .item-sub { font-size: 12px; color: var(--ink-2); }
  .item-meta { font-size: 11.5px; color: var(--ink-2); text-align: right; }

  /* -------------------------------------------------------------- main */

  .main { grid-area: main; overflow: auto; min-height: 0; }

  .record { padding: 22px 26px 30px; max-width: 1100px; }

  .record-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

  h1 { font-size: 20px; line-height: 1.25; margin: 0; font-weight: 600; letter-spacing: -0.015em; }

  .subject { color: var(--ink-2); font-size: 13px; margin: 5px 0 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 4px 11px 4px 9px;
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
  }

  .chip.pledged { color: var(--accent); border-color: var(--accent); background: var(--accent-wash); }
  .chip.settled { color: var(--good); border-color: color-mix(in oklch, var(--good) 45%, var(--line)); background: oklch(0.965 0.02 168); }
  .chip.free { color: var(--ink-2); background: var(--panel-2); }

  .copy {
    border: 0;
    background: none;
    padding: 2px 4px;
    color: var(--ink-2);
    cursor: pointer;
    border-radius: 4px;
    transition: color 140ms var(--ease), background 140ms var(--ease);
  }
  .copy:hover { color: var(--accent); background: var(--accent-wash); }

  .facts {
    margin: 22px 0 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 1px;
    background: var(--bg);
  }

  /* one hairline per cell, so a half empty last row stays empty rather than
     leaving a grey block where a fact is missing */
  .fact { padding: 12px 14px; box-shadow: 0 0 0 1px var(--line); border-radius: 2px; }
  .fact dt { font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
  .fact dd { margin: 0; font-size: 13.5px; word-break: break-word; }

  h2 {
    font-size: 13px;
    font-weight: 600;
    margin: 26px 0 10px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  h2 .hint { font-weight: 400; color: var(--ink-2); font-size: 12.5px; }

  /* provenance: a real three-step sequence, so it is drawn as one */
  .chain { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: stretch; gap: 0; }

  .step { border: 1px solid var(--line); border-radius: var(--r); padding: 11px 13px; background: var(--bg); }
  .step .k { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .step .v { font-size: 13px; }
  .arrow { display: grid; place-items: center; width: 34px; color: var(--line-strong); }

  .callout {
    margin: 22px 0 0;
    border: 1px solid color-mix(in oklch, var(--danger) 35%, var(--line));
    background: var(--danger-wash);
    border-radius: var(--r);
    padding: 14px 16px;
  }

  .callout h3 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; color: var(--danger); }
  .callout p { margin: 0 0 12px; font-size: 13px; color: var(--ink); max-width: 70ch; }
  .callout .pair { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .callout .who { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    z-index: var(--z-sticky);
    background: var(--bg);
    text-align: left;
    font-weight: 500;
    font-size: 12px;
    color: var(--ink-2);
    padding: 0 12px 7px 0;
    border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--panel-2); vertical-align: baseline; }
  tbody tr:hover td { background: var(--panel); }

  .tag { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.pledge { color: var(--accent); background: var(--accent-wash); }
  .tag.refused { color: var(--danger); background: var(--danger-wash); }
  .tag.settled { color: var(--good); background: oklch(0.965 0.02 168); }
  .tag.released { color: var(--ink-2); background: var(--panel-2); }

  .empty { padding: 40px 26px; max-width: 60ch; color: var(--ink-2); }
  .empty h2 { margin: 0 0 8px; font-size: 15px; color: var(--ink); }
  .empty p { margin: 0 0 10px; font-size: 13.5px; }

  .skel { display: block; height: 12px; border-radius: 3px; background: var(--panel-2); position: relative; overflow: hidden; }
  .skel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.7), transparent);
    animation: sweep 1.2s linear infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .fade { animation: fade 180ms var(--ease) both; }
  @keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  .toast {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: var(--z-toast);
    background: var(--ink);
    color: var(--bg);
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 160ms var(--ease);
  }
  .toast.on { opacity: 1; }

  .note { margin: 28px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12.5px; max-width: 72ch; }

  .tabs { display: none; }

  /* --------------------------------------------------------- responsive */

  @media (max-width: 1080px) {
    .chain { grid-template-columns: 1fr; gap: 8px; }
    .arrow { display: none; }
  }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; grid-template-areas: "bar" "tabs" "main"; grid-template-rows: auto auto 1fr; }
    .status { display: none; }
    .rail { grid-area: main; border-right: 0; }
    .tabs {
      grid-area: tabs;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      background: none;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 11px 0;
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    body[data-pane="record"] .rail { display: none; }
    body[data-pane="register"] .main { display: none; }
    .record { padding: 18px 16px 40px; }
    .list { max-height: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body data-pane="record">
<div class="app">

  <header class="bar">
    <div class="mark">
      <svg width="17" height="17" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="6" fill="oklch(0.48 0.15 290)"></rect>
        <rect x="10" y="10" width="12" height="12" rx="2" fill="none" stroke="#fff" stroke-width="2.4"></rect>
      </svg>
      Singleton <span>register of liens</span>
    </div>

    <div class="status" id="status">
      <div><span class="dot idle"></span><span class="skel" style="width:170px"></span></div>
    </div>

    <div class="reg">
      <span>registry</span>
      <a id="registryLink" class="mono" target="_blank" rel="noreferrer"></a>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="false" data-pane="register">Register</button>
    <button role="tab" aria-selected="true" data-pane="record">Record</button>
  </nav>

  <aside class="rail">
    <form class="lookup" id="lookup" autocomplete="off">
      <div>
        <label for="token">Look up an asset</label>
        <input id="token" class="mono" placeholder="collateral contract 0x..." spellcheck="false" />
      </div>
      <div class="row">
        <select id="chain" aria-label="Source chain"></select>
        <input id="tokenId" class="mono" placeholder="token id" spellcheck="false" aria-label="Token id" />
      </div>
      <button class="btn" type="submit">Check the register</button>
    </form>

    <div class="rail-head">
      <span>On file</span>
      <span id="railCount"></span>
    </div>

    <div class="list" id="list">
      <div style="padding:10px"><span class="skel" style="width:80%"></span></div>
      <div style="padding:10px"><span class="skel" style="width:60%"></span></div>
      <div style="padding:10px"><span class="skel" style="width:70%"></span></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">
      <h2>Pick an asset, or look one up</h2>
      <p>The register answers one question: does this asset already carry a lien somewhere, recorded by a protocol that never had to cooperate.</p>
      <p>A result of <b>free</b> means unregistered here, which is not the same as unpledged.</p>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* --------------------------------------------------------------- config */

const QUERY = new URLSearchParams(location.search);

const CFG = {
  rpc: QUERY.get("rpc") ?? "https://rpc.cc3-testnet.creditcoin.network",
  registry: QUERY.get("registry") ?? "0x90f03329aF069BbC4AB4d34c03c9c6DF1Fcc32d4",
  explorer: "https://creditcoin-testnet.blockscout.com",
  chainInfo: "0x0000000000000000000000000000000000000fD3",
  sources: {
    11155111: { name: "Sepolia", explorer: "https://sepolia.etherscan.io" },
    1: { name: "Ethereum", explorer: "https://etherscan.io" },
  },
  known: {
    "0xee79491615882b5421dacebv765564f4c4a09dd64": "",
    "0xee79491615882b5421daceb765564f4c4a09dd64": "Demo deed",
    "0xd774557b647330c91bf44cfeab205095f7e6c367": "NFTfi collateral",
    "0xbd3531da5cf5857e7cfaa92426877b022e612cf8": "Pudgy Penguins",
    "0x524cab2ec69124574082676e6f654a18df49a048": "Lil Pudgys",
    "0x60e4d786628fea6478f785a6d7e704777c86a7c6": "Mutant Ape",
  },
  emitters: {
    "0xaad02e7bebc37acb5dc67c42f70d61d8c86df3e5": "Harbor Credit",
    "0xfa72380654232c5538d1f17e2d8d6c261bd263ad": "Meridian Credit",
    "0xb6adec2acc851d30d5fb64f3137234bcdcbbad0d": "NFTfi v3",
    "0x29469395eaf6f95920e59f858042f0e28d98a20b": "Blur Blend",
  },
};

const SELECTOR = {
  assetKeyOf: "0xa5fa9d70",
  getStatus: "0x5de28ae0",
  collisionCount: "0x1cf4e706",
  collisionAt: "0x6f81b28f",
  certificateOf: "0x27027589",
  minConfirmations: "0xfd166d65",
  supportedChains: "0x69e18c3c",
  attestedTip: "0x809112da",
};

const TOPIC = {
  "0xb4de7f620eb5d8eaab350bc099399f71c08c2fde907ce2b8d68f9651b0535eb8": "pledge",
  "0x78bf8702fc87c1887744d1d92e9af8673bc6da890a1da46b549888e34f4a2400": "refused",
  "0x181a581803236c268c5f5e8ad0f668e8a3032c00311e3954bcf84a3ec8d90a09": "settled",
  "0x99b0f20d6946893f54e3836d815265d601b32da1ef5a840d17fe8295e68a9bf6": "released",
};

const ENTRY = {
  pledge: "Lien recorded, first to file",
  refused: "Second pledge refused, kept on file",
  settled: "Debt behind the lien settled",
  released: "Lien released, asset free again",
};

const STATE = ["free", "pledged", "settled"];
const ZERO = "0x0000000000000000000000000000000000000000";

/* ------------------------------------------------------------------ abi */

const pad = (h) => h.replace(/^0x/, "").padStart(64, "0");
const word = (d, i) => d.slice(2 + i * 64, 2 + (i + 1) * 64);
const big = (w) => BigInt("0x" + w);
const addr = (w) => "0x" + w.slice(24);
const uint = (v) => pad(BigInt(v).toString(16));

let rpcId = 0;

async function rpc(method, params) {
  const res = await fetch(CFG.rpc, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: ++rpcId, method, params }),
  });
  if (!res.ok) throw new Error(`the node answered ${res.status}`);
  const body = await res.json();
  if (body.error) throw new Error(body.error.message || "the node refused the call");
  return body.result;
}

const call = (to, data) => rpc("eth_call", [{ to, data }, "latest"]);

function decodeChains(hex) {
  const base = Number(big(word(hex, 0))) / 32;
  const count = Number(big(word(hex, base)));
  const out = [];
  for (let i = 0; i < count; i++) {
    const off = base + 1 + Number(big(word(hex, base + 1 + i))) / 32;
    out.push({ chainKey: Number(big(word(hex, off))), chainId: Number(big(word(hex, off + 1))) });
  }
  return out;
}

/**
 * The public node abandons a log query it cannot answer in ten seconds, so the
 * register is read in narrow windows at once. A window that fails costs its own
 * slice and nothing else.
 */
async function logWindows(topics, { windows = 8, size = 4000 } = {}) {
  const head = Number(big((await rpc("eth_blockNumber", [])).slice(2).padStart(64, "0")));
  const slices = Array.from({ length: windows }, (_, i) => {
    const to = head - i * size;
    return { from: Math.max(0, to - size + 1), to };
  }).filter((w) => w.to >= 0);

  const answers = await Promise.all(
    slices.map(({ from, to }) =>
      rpc("eth_getLogs", [
        { address: CFG.registry, topics, fromBlock: "0x" + from.toString(16), toBlock: "0x" + to.toString(16) },
      ]).catch(() => []),
    ),
  );

  const logs = answers.flat().filter((l) => TOPIC[l.topics[0]]);
  logs.sort((a, b) => Number(BigInt(b.blockNumber) - BigInt(a.blockNumber)) || b.logIndex - a.logIndex);
  return { head, logs, span: slices.length * size };
}

/* ------------------------------------------------------------- helpers */

const $ = (id) => document.getElementById(id);
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const short = (h, a = 6, b = 4) => (h && h.length > a + b + 4 ? `${h.slice(0, 2 + a)}…${h.slice(-b)}` : h ?? "");
const n = (v) => Number(v).toLocaleString("en-US");
const nameOf = (map, a) => map[(a || "").toLowerCase()] ?? null;

function ether(wei) {
  const whole = wei / 10n ** 18n;
  const frac = (wei % 10n ** 18n).toString().padStart(18, "0").slice(0, 4).replace(/0+$/, "");
  return frac ? `${whole}.${frac}` : `${whole}`;
}

function ago(seconds) {
  const d = Math.max(0, Math.floor(Date.now() / 1000) - seconds);
  if (d < 3600) return `${Math.max(1, Math.round(d / 60))}m ago`;
  if (d < 86400) return `${Math.round(d / 3600)}h ago`;
  return `${Math.round(d / 86400)}d ago`;
}

let toastTimer;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1600);
}

function copyButton(value, label) {
  const b = el(`<button class="copy" type="button" title="Copy ${label}" aria-label="Copy ${label}">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect><path d="M10.5 3.5h-7a1 1 0 0 0-1 1v7"></path>
    </svg></button>`);
  b.addEventListener("click", () => { navigator.clipboard?.writeText(value); toast(`${label} copied`); });
  return b;
}

const txLink = (hash) => `<a class="mono" href="${CFG.explorer}/tx/${hash}" target="_blank" rel="noreferrer">${short(hash, 8, 6)}</a>`;

function srcLink(chainId, path, text) {
  const s = CFG.sources[chainId];
  return s ? `<a href="${s.explorer}/${path}" target="_blank" rel="noreferrer">${text}</a>` : text;
}

/* --------------------------------------------------------------- state */

const CHAINS = {};
let REGISTER = [];
let selectedKey = null;

/* --------------------------------------------------------------- reads */

async function loadChains() {
  const chains = decodeChains(await call(CFG.chainInfo, SELECTOR.supportedChains));
  const select = $("chain");
  select.innerHTML = "";

  const known = chains.filter((c) => CFG.sources[c.chainId]).sort((a, b) => a.chainId - b.chainId);

  await Promise.all(
    known.map(async ({ chainKey, chainId }) => {
      const [tip, depth] = await Promise.all([
        call(CFG.chainInfo, SELECTOR.attestedTip + uint(chainKey)),
        call(CFG.registry, SELECTOR.minConfirmations + uint(chainKey)),
      ]);
      CHAINS[chainId] = { chainKey, tip: Number(big(word(tip, 0))), depth: Number(big(word(depth, 0))) };
    }),
  );

  $("status").innerHTML = known
    .map(({ chainId }) => {
      const c = CHAINS[chainId];
      return `<div title="Creditcoin has attested ${CFG.sources[chainId].name} up to this block. A pledge is accepted once it is ${c.depth} blocks deep.">
        <span class="dot"></span>${CFG.sources[chainId].name} attested to <b class="num">${n(c.tip)}</b></div>`;
    })
    .join("");

  for (const { chainId } of known) {
    const o = document.createElement("option");
    o.value = String(chainId);
    o.textContent = CFG.sources[chainId].name;
    select.appendChild(o);
  }
}

async function readAsset(chainId, token, tokenId) {
  const chain = CHAINS[chainId];
  if (!chain) throw new Error(`chain id ${chainId} is not attested by this network`);

  const assetKey = await call(CFG.registry, SELECTOR.assetKeyOf + uint(chain.chainKey) + pad(token.toLowerCase()) + uint(tokenId));
  const [status, certificate, countHex] = await Promise.all([
    call(CFG.registry, SELECTOR.getStatus + pad(assetKey)),
    call(CFG.registry, SELECTOR.certificateOf + pad(assetKey)),
    call(CFG.registry, SELECTOR.collisionCount + pad(assetKey)),
  ]);

  const count = Number(big(word(countHex, 0)));
  const collisions = await Promise.all(
    Array.from({ length: count }, (_, i) =>
      call(CFG.registry, SELECTOR.collisionAt + pad(assetKey) + uint(i)).then((c) => ({
        emitter: addr(word(c, 0)),
        borrower: addr(word(c, 1)),
        amount: big(word(c, 2)),
        sourceHeight: Number(big(word(c, 5))),
      })),
    ),
  );

  return {
    assetKey, chainId, token, tokenId,
    state: Number(big(word(status, 0))),
    emitter: addr(word(status, 1)),
    borrower: addr(word(status, 2)),
    amount: big(word(status, 3)),
    instanceId: "0x" + word(status, 4),
    sourceHeight: Number(big(word(status, 6))),
    recordedAt: Number(big(word(status, 7))),
    certificate: addr(word(certificate, 0)),
    collisions,
  };
}

/* -------------------------------------------------------------- render */

function assetLabel(token, tokenId) {
  const name = nameOf(CFG.known, token);
  return name ? `${name} #${tokenId}` : `${short(token, 6, 4)} #${tokenId}`;
}

function renderRail() {
  const list = $("list");
  $("railCount").textContent = REGISTER.length ? `${REGISTER.length} assets` : "";

  if (!REGISTER.length) {
    list.innerHTML = `<div style="padding:12px 10px;color:var(--ink-2);font-size:13px">No entries in the recent window.</div>`;
    return;
  }

  list.innerHTML = "";
  for (const a of REGISTER) {
    const item = el(`<button class="item" type="button" aria-current="${a.assetKey === selectedKey}">
      <span class="pip ${a.state}"></span>
      <span>
        <span class="item-name">${a.label}</span><br />
        <span class="item-sub">${a.holder ?? "no lien on file"}${a.collisions ? ` &middot; ${a.collisions} refused` : ""}</span>
      </span>
      <span class="item-meta">${a.when}</span>
    </button>`);
    item.addEventListener("click", () => select(a.chainId, a.token, a.tokenId));
    list.appendChild(item);
  }
}

function renderRecord(r, logs) {
  const chain = CHAINS[r.chainId];
  const src = CFG.sources[r.chainId];
  const holder = nameOf(CFG.emitters, r.emitter);
  const state = STATE[r.state];
  const opening = logs.find((l) => TOPIC[l.topics[0]] === "pledge");
  const closing = logs.find((l) => ["released", "settled"].includes(TOPIC[l.topics[0]]));
  const refusal = logs.find((l) => TOPIC[l.topics[0]] === "refused");

  const facts = r.state === 0
    ? [
        ["Standing", logs.length ? "Registered before, released since" : "Never registered here"],
        ["Source chain", `${src.name}, chain key ${chain.chainKey}`],
        ["Collateral", srcLink(r.chainId, `token/${r.token}`, `<span class="mono">${short(r.token, 10, 6)}</span>`)],
      ]
    : [
        ["Lien held by", (holder ? holder + " " : "") + srcLink(r.chainId, `address/${r.emitter}`, `<span class="mono">${short(r.emitter, 8, 6)}</span>`)],
        ["Borrower", srcLink(r.chainId, `address/${r.borrower}`, `<span class="mono">${short(r.borrower, 8, 6)}</span>`)],
        ["Principal", `<span class="num">${ether(r.amount)}</span> <span style="color:var(--ink-2)">in the protocol's own unit</span>`],
        ["Lien instance", `<span class="mono">${short(r.instanceId, 10, 6)}</span>`],
        ["Certificate", r.certificate === ZERO ? "none" : `soulbound, held by the lender`],
        ["Recorded", `${new Date(r.recordedAt * 1000).toISOString().slice(0, 16).replace("T", " ")} UTC`],
      ];

  const node = el(`<div class="record fade">
    <div class="record-head">
      <div style="flex:1 1 320px">
        <h1>${assetLabel(r.token, r.tokenId)}</h1>
        <p class="subject">
          ${srcLink(r.chainId, `token/${r.token}`, `<span class="mono">${short(r.token, 10, 8)}</span>`)}
          on ${src.name}
          <span style="color:var(--line-strong)">/</span>
          <span class="mono" title="${r.assetKey}">key ${short(r.assetKey, 8, 6)}</span>
          <span data-copy-slot></span>
        </p>
      </div>
      <span class="chip ${state}"><span class="pip ${state}"></span>${state}${r.state === 1 ? ", first to file" : ""}</span>
    </div>

    <dl class="facts">${facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>

    ${r.collisions.length ? `<div class="callout">
      <h3>A second protocol tried to lend against this asset</h3>
      <p>The first filing holds. The second was refused on chain and kept on file, because a lender checking here wants to know that somebody already tried, not only that the asset is taken.</p>
      <div class="pair">
        <span class="who"><b>${nameOf(CFG.emitters, r.collisions.at(-1).emitter) ?? short(r.collisions.at(-1).emitter, 8, 6)}</b>
          tried to lend ${ether(r.collisions.at(-1).amount)}, proven from ${src.name} block
          <span class="num">${n(r.collisions.at(-1).sourceHeight)}</span></span>
        ${refusal ? `<span style="color:var(--ink-2)">refusal on chain in ${txLink(refusal.transactionHash)}</span>` : ""}
      </div>
    </div>` : ""}

    <h2>How this is known <span class="hint">nobody was trusted for any step</span></h2>
    <div class="chain">
      <div class="step"><div class="k">The protocol's own log</div><div class="v">${
        r.state !== 0
          ? `${src.name} block ${srcLink(r.chainId, `block/${r.sourceHeight}`, `<span class="num">${n(r.sourceHeight)}</span>`)}`
          : opening ? `a lien on ${src.name}, since closed` : "nothing on file"
      }</div></div>
      <div class="arrow" aria-hidden="true">
        <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 5h14M10 1l4 4-4 4"/></svg>
      </div>
      <div class="step"><div class="k">Inclusion proof</div><div class="v">re-checked on chain by BlockProver <span class="mono">0x0FD2</span>, accepted at ${chain.depth} blocks deep</div></div>
      <div class="arrow" aria-hidden="true">
        <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 5h14M10 1l4 4-4 4"/></svg>
      </div>
      <div class="step"><div class="k">The register</div><div class="v">${
        opening ? `written in ${txLink(opening.transactionHash)}${r.state === 0 && closing ? `, closed in ${txLink(closing.transactionHash)}` : ""}` : "nothing written"
      }</div></div>
    </div>

    <h2>History <span class="hint">${logs.length} ${logs.length === 1 ? "entry" : "entries"}</span></h2>
    ${logs.length ? `<table><thead><tr><th>Entry</th><th>What happened</th><th>Protocol</th><th>On Creditcoin</th></tr></thead><tbody>
      ${logs.map((l) => {
        const kind = TOPIC[l.topics[0]];
        const party = "0x" + (kind === "refused" ? l.topics[3] : l.topics[2]).slice(26);
        return `<tr><td><span class="tag ${kind}">${kind}</span></td><td>${ENTRY[kind]}</td>` +
          `<td>${nameOf(CFG.emitters, party) ?? `<span class="mono">${short(party, 6, 4)}</span>`}</td>` +
          `<td>${txLink(l.transactionHash)}</td></tr>`;
      }).join("")}
    </tbody></table>` : `<p style="color:var(--ink-2);font-size:13px;margin:0">This asset has never been registered here. That is not the same as never pledged: the register is a positive record, and Attestcoin cannot prove that something did not happen.</p>`}

    <p class="note">Everything above is an <span class="mono">eth_call</span> against Creditcoin that anybody can repeat. There is no backend and no indexer between this page and the chain.</p>
  </div>`);

  node.querySelector("[data-copy-slot]").replaceWith(copyButton(r.assetKey, "asset key"));
  $("main").innerHTML = "";
  $("main").appendChild(node);
}

function renderLoading() {
  $("main").innerHTML = `<div class="record">
    <span class="skel" style="width:220px;height:20px"></span>
    <div style="margin-top:12px"><span class="skel" style="width:340px"></span></div>
    <div style="margin-top:26px;display:grid;gap:10px">
      <span class="skel" style="width:100%;height:56px"></span>
      <span class="skel" style="width:100%;height:56px"></span>
    </div>
  </div>`;
}

function renderError(message) {
  $("main").innerHTML = `<div class="empty"><h2>The register did not answer</h2><p>${message}</p>
    <p>The page reads one Creditcoin node directly. If it is unreachable, nothing here can be shown, which is the honest failure for a tool with no backend.</p></div>`;
}

/* ---------------------------------------------------------------- flow */

async function select(chainId, token, tokenId) {
  $("chain").value = String(chainId);
  $("token").value = token;
  $("tokenId").value = String(tokenId);
  if (window.matchMedia("(max-width: 900px)").matches) setPane("record");
  renderLoading();

  try {
    const record = await readAsset(chainId, token, tokenId);
    selectedKey = record.assetKey;
    renderRail();
    const { logs } = await logWindows([null, record.assetKey]);
    renderRecord(record, logs);
  } catch (error) {
    renderError(error.message);
  }
}

/**
 * The rail is built from the register's own logs: every asset it has touched
 * recently, newest first, with its current state read back per asset.
 */
async function loadRegister() {
  const { logs } = await logWindows([]);
  const seen = new Map();

  for (const l of logs) {
    const key = l.topics[1];
    if (!seen.has(key)) seen.set(key, l);
  }

  const assets = [];
  for (const [key, last] of seen) {
    const match = REGISTER_HINTS.find((h) => h.assetKey === key);
    if (!match) continue;
    assets.push({ ...match, last });
  }

  const detailed = await Promise.all(
    assets.map(async (a) => {
      const status = await call(CFG.registry, SELECTOR.getStatus + pad(a.assetKey));
      const state = Number(big(word(status, 0)));
      const emitter = addr(word(status, 1));
      const collisions = Number(big(word(await call(CFG.registry, SELECTOR.collisionCount + pad(a.assetKey)), 0)));
      return {
        ...a,
        state: STATE[state],
        collisions,
        // a released record keeps no timestamp, because the record itself is gone
        when: state === 0 ? "released" : ago(Number(big(word(status, 7)))),
        holder: state === 0 ? null : (nameOf(CFG.emitters, emitter) ?? short(emitter, 6, 4)),
        label: assetLabel(a.token, a.tokenId),
      };
    }),
  );

  REGISTER = detailed;
  renderRail();
}

/* The register indexes by asset key, and a key is a hash: it cannot be turned
   back into a contract and a token id. These are the assets this deployment has
   handled, so the rail can name them; anything else is one lookup away. */
const REGISTER_HINTS = [
  { chainId: 11155111, token: "0xee79491615882b5421dACEb765564f4c4a09dd64", tokenId: "42" },
  { chainId: 1, token: "0xd774557b647330C91Bf44cfEAB205095f7E6c367", tokenId: "7819" },
  { chainId: 1, token: "0xBd3531dA5CF5857e7CfAA92426877b022e612cf8", tokenId: "8189" },
  { chainId: 1, token: "0xBd3531dA5CF5857e7CfAA92426877b022e612cf8", tokenId: "4271" },
];

function setPane(pane) {
  document.body.dataset.pane = pane;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.pane === pane)));
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const pane = e.target.closest("button")?.dataset.pane;
  if (pane) setPane(pane);
});

$("lookup").addEventListener("submit", (e) => {
  e.preventDefault();
  const token = $("token").value.trim();
  const tokenId = $("tokenId").value.trim();
  if (!/^0x[0-9a-fA-F]{40}$/.test(token)) return toast("That is not a contract address");
  if (!/^\d+$/.test(tokenId)) return toast("Token id must be a number");
  select(Number($("chain").value), token, tokenId);
});

$("registryLink").textContent = short(CFG.registry, 6, 4);
$("registryLink").href = `${CFG.explorer}/address/${CFG.registry}`;

(async () => {
  try {
    await loadChains();
    for (const hint of REGISTER_HINTS) {
      const chain = CHAINS[hint.chainId];
      if (!chain) continue;
      hint.assetKey = await call(CFG.registry, SELECTOR.assetKeyOf + uint(chain.chainKey) + pad(hint.token.toLowerCase()) + uint(hint.tokenId));
    }
    await loadRegister();
    // open on the asset that shows the most: a live lien somebody already
    // tried to file against, then any live lien, then whatever is newest
    const first =
      REGISTER.find((a) => a.state !== "free" && a.collisions > 0) ??
      REGISTER.find((a) => a.state !== "free") ??
      REGISTER[0] ??
      REGISTER_HINTS[0];
    await select(first.chainId, first.token, first.tokenId);
  } catch (error) {
    renderError(error.message);
    $("status").innerHTML = `<div style="color:var(--danger)">node unreachable</div>`;
  }
})();
</script>
</body>
